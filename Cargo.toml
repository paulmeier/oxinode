[package]
name = "oxinode"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "RNode-compatible LoRa modem firmware for the muzi.works Base Duo (nRF52840 + LR1121)"
repository = "https://github.com/paulmeier/oxinode"
publish = false

[workspace]
members = ["core"]

[dependencies]
oxinode-core = { path = "core" }
critical-section = "1.2"
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    # Single-core Cortex-M: interrupt-masking is a sufficient critical section.
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.6"

embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-nrf = { version = "0.11", features = [
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "time",
    "unstable-pac",   # POWER.GPREGRET, for reboot-into-bootloader
] }
embassy-usb = "0.6"
defmt = "1.0"

# Radio. `lr11xx` needs an *async* embedded-hal SpiDevice; `embedded-hal-bus`
# supplies the exclusive-owner wrapper that turns embassy's SPIM plus a
# chip-select GPIO into one. `lora-phy` and `defmt` are mandatory dependencies
# of `lr11xx` with no feature to switch them off -- see docs/phase-3-radio.md
# for why oxinode uses the low-level API and lets LTO drop the rest.
lr11xx = "0.1"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", default-features = false, features = ["async"] }
static_cell = "2.1"

[build-dependencies]
# Shares the memory.x parser with the firmware, so the address baked into the
# image and the address in the linker script cannot disagree.
oxinode-core = { path = "core" }

[[bin]]
name = "blink"
path = "src/bin/blink.rs"

[[bin]]
name = "usb-cdc"
path = "src/bin/usb_cdc.rs"

# Phase 3 bring-up image. Deliberately separate from `usb-cdc` until phase 5
# merges the transports: with no debug probe, a failure you can bisect by
# choosing which image to flash is worth the duplication.
[[bin]]
name = "radio"
path = "src/bin/radio.rs"

# Debug builds of this still have to fit in 784K of flash and run at 64 MHz,
# so keep some optimisation on even in dev.
[profile.dev]
opt-level = "s"
debug = 2
lto = false
incremental = true

[profile.release]
opt-level = "s"
debug = 2          # kept: costs nothing in flash, makes backtraces readable
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
