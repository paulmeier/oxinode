[package]
name = "oxinode"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "RNode-compatible LoRa modem firmware for the muzi.works Base Duo (nRF52840 + LR1121)"
repository = "https://github.com/paulmeier/oxinode"
publish = false

[workspace]
members = ["core"]

[features]
# Exactly one critical-section implementation may be linked, and the two builds
# need different ones -- so the choice is a feature rather than a dependency.
#
# `cortex-m`'s single-core implementation masks *every* interrupt. That is
# correct for phases 1-7 and wrong the moment MPSL is running: the Bluetooth
# controller's timing is kept by RADIO, RTC0 and TIMER0, and a critical section
# that stops those loses connections. `nrf-mpsl` ships an implementation that
# masks everything *except* those three.
#
# The MPSL one would work in both builds -- with MPSL absent those interrupts
# are never enabled -- but it costs an NVIC mask save and restore on every
# critical section, and `embassy-time` takes one per timer operation. So the
# non-BLE images keep the cheap one.
default = ["cs-single-core"]
cs-single-core = ["cortex-m/critical-section-single-core"]

# Phase 8. Build with:
#     cargo build --release --no-default-features --features ble
ble = [
    "dep:nrf-mpsl",
    "dep:nrf-sdc",
    "dep:trouble-host",
    "dep:heapless",
    "nrf-mpsl/critical-section-impl",
]

[dependencies]
oxinode-core = { path = "core" }
critical-section = "1.2"
# The critical-section implementation is NOT selected here. It comes from a
# feature, because a BLE build has to use a different one -- see [features].
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"

embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-nrf = { version = "0.11", features = [
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "time",
    "unstable-pac",   # POWER.GPREGRET, for reboot-into-bootloader
] }
embassy-usb = "0.6"
# A pipe between the USB reader and the modem loop. See src/bin/rnode.rs: the
# reason it exists is that `read_packet` must never be cancelled, and anything
# that races it with `select` cancels it.
embassy-sync = "0.8"
defmt = "1.0"

# Radio. `lr11xx` needs an *async* embedded-hal SpiDevice; `embedded-hal-bus`
# supplies the exclusive-owner wrapper that turns embassy's SPIM plus a
# chip-select GPIO into one. `lora-phy` and `defmt` are mandatory dependencies
# of `lr11xx` with no feature to switch them off -- see docs/phase-3-radio.md
# for why oxinode uses the low-level API and lets LTO drop the rest.
lr11xx = "0.1"
# `lr11xx` takes its bit-packed command arguments as arbitrary-width ints.
arbitrary-int = "1.3"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", default-features = false, features = ["async"] }
# The internal-flash driver speaks embedded-storage; phase 6 stores the device
# record in the 40 KB the bootloader reserves above the application.
embedded-storage = "0.3"

# Phase 8: Bluetooth LE. `nrf-mpsl` and `nrf-sdc` wrap Nordic's own
# SoftDevice Controller -- a binary blob under LicenseRef-Nordic-5-Clause,
# vendored in `nrf-sdc-sys` and licensed for use on Nordic silicon, which is
# what this is. `trouble-host` is the host stack above it. These are optional
# because they change the critical-section implementation for the whole image;
# see [features].
#
# The versions are not a free choice: nrf-mpsl 0.4 and nrf-sdc 0.4 both pin
# embassy-nrf 0.11 and embassy-sync 0.8, and trouble-host 0.8 pins embassy-time
# 0.5.1 -- exactly what phases 1 to 7 already use. Moving any of them moves all
# of them.
nrf-mpsl = { version = "0.4", optional = true, features = ["defmt", "nrf52840"] }
nrf-sdc = { version = "0.4", optional = true, default-features = false, features = [
    "defmt",
    "nrf52840",
    # Peripheral only. This board is advertised to and connected to; it never
    # scans or initiates, and the central role is a third of a megabyte of
    # controller library we would never call.
    "peripheral",
] }
# Fixed-capacity byte vectors, which is how trouble-host's GATT table holds a
# variable-length characteristic value. Same major as trouble's own.
heapless = { version = "0.9", optional = true }
trouble-host = { version = "0.8", optional = true, default-features = false, features = [
    "defmt",
    "peripheral",
    "gatt",
    "derive",
    "default-packet-pool",
] }
static_cell = "2.1"

[build-dependencies]
# Shares the memory.x parser with the firmware, so the address baked into the
# image and the address in the linker script cannot disagree.
oxinode-core = { path = "core" }

[[bin]]
name = "blink"
path = "src/bin/blink.rs"

[[bin]]
name = "usb-cdc"
path = "src/bin/usb_cdc.rs"

# Phase 3 bring-up image. Deliberately separate from `usb-cdc` until phase 5
# merges the transports: with no debug probe, a failure you can bisect by
# choosing which image to flash is worth the duplication.
[[bin]]
name = "radio"
path = "src/bin/radio.rs"

# Phase 5: the product image. A Reticulum host opens the first serial port and
# finds a modem; the second carries the log. Since phase 8 it also carries the
# Bluetooth stack, and therefore the `ble` feature's critical section:
#     cargo build --release --no-default-features --features ble --bin rnode
[[bin]]
name = "rnode"
path = "src/bin/rnode.rs"
required-features = ["ble"]

# Phase 7 bring-up image for the Super IO board's OLED. Separate from `rnode`
# for the same reason `radio` was: with no debug probe, a failure you can
# bisect by choosing which image to flash is worth the duplication.
[[bin]]
name = "display"
path = "src/bin/display.rs"

# Phase 8 bring-up image for the Bluetooth stack. Needs the `ble` feature, and
# therefore a different critical section, so it cannot be built in the same
# invocation as the others:
#     cargo build --release --no-default-features --features ble --bin ble
[[bin]]
name = "ble"
path = "src/bin/ble.rs"
required-features = ["ble"]

# Debug builds of this still have to fit in 784K of flash and run at 64 MHz,
# so keep some optimisation on even in dev.
[profile.dev]
opt-level = "s"
debug = 2
lto = false
incremental = true

[profile.release]
opt-level = "s"
debug = 2          # kept: costs nothing in flash, makes backtraces readable
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
